<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tend</title>
<meta name="theme-color" content="#F7F9F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tend">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tend.css">
</head>
<body>
<div class="wrap">
  <div class="apphead">
    <div class="brand">
      <img data-tend-logo alt="tend" style="height:42px;width:auto;display:block">
      <div>
        <div class="sub" id="headDate"></div>
        <div class="sub" style="letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--ink-soft);font-size:11.5px">Care for what matters.</div>
      </div>
    </div>
    <div class="syncdot" id="syncDot"><i></i><span id="syncLabel">local only</span></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="people">People</button>
    <button data-tab="prayer">Prayer</button>
    <button data-tab="echo">Echo</button>
    <button data-tab="offload">Offload</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="sync">Sync</button>
  </nav>
  <div id="view"></div>
</div>
<div class="modal" id="logModal">
  <div class="box">
    <h3>Log a moment</h3>
    <div class="row">
      <select id="logArea"></select>
      <select id="logPerson"></select>
    </div>
    <div class="row"><select id="logKind"></select></div>
    <textarea id="logNote" placeholder="What happened? (optional)"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitLog()">Save</button>
    </div>
  </div>
</div>
<div class="flash" id="flash">Saved</div>
<script src="app-core.js"></script>
<script src="app-views1.js"></script>
<script src="app-views2.js"></script>
<script src="app-actions.js"></script>
<script src="app-sync.js"></script>
</body>
</html>
