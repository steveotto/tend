<script>window.onerror=function(msg,src,line){var f=document.getElementById("flash");if(f){f.textContent="ERR: "+msg+" ("+(src||"").split("/").pop()+":"+line+")";f.classList.add("show");f.style.background="#B3402E";}};</script>

<body>
<div class="wrap">
  <div class="apphead">
    <div class="brand">
      <img data-tend-logo alt="tend" style="height:42px;width:auto;display:block">
      <div>
        <div class="sub" id="headDate"></div>
        <div class="sub" style="letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--ink-soft);font-size:11.5px">Structure beats good intentions</div>
      </div>
    </div>
    <div class="syncdot" id="syncDot"><i></i><span id="syncLabel">local only</span></div>
  </div>
  <div class="sticky-nav">
    <nav class="areanav" id="areaNav"></nav>
    <nav class="tabs" id="utilNav"></nav>
  </div>
  <div id="view"></div>
</div>
<div class="modal" id="logModal">
  <div class="box">
    <h3>Log a moment</h3>
    <div class="row">
      <select id="logArea"></select>
      <select id="logPerson"></select>
    </div>
    <div class="row"><select id="logKind"></select></div>
    <textarea id="logNote" placeholder="What happened? (optional)"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitLog()">Save</button>
    </div>
  </div>
</div>
<div class="flash" id="flash">Saved</div>
