name: Foundation validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preview and production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: foundation-preview/package-lock.json
      - name: Install locked dependencies
        working-directory: foundation-preview
        run: npm ci
      - name: Install Chromium for browser contracts
        working-directory: foundation-preview
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: foundation-preview
        run: npm run typecheck
      - name: Test calendar reader
        working-directory: foundation-preview
        run: npm run test:reader
      - name: Test components
        working-directory: foundation-preview
        run: npm run test:components -- --testTimeout=15000
      - name: Test Classic compatibility
        working-directory: foundation-preview
        run: npm run test:legacy
      - name: Test browser CSS contracts
        working-directory: foundation-preview
        run: npm run test:browser-css
      - name: Test browser recovery safeguards
        working-directory: foundation-preview
        run: npm run test:recovery-browser
      - name: Build production artifacts
        working-directory: foundation-preview
        run: npm run build
      - name: Test Pages production artifact
        working-directory: foundation-preview
        run: npm run test:pages-artifact
